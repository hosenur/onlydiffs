name: Release

# Tagging is the release. Pushing `v0.1.1` builds the desktop app and opens a
# draft GitHub Release; publishing that draft is what puts it in front of
# users, and is also what makes `latest.json` reachable by the updater.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # The tag is what names the release; tauri.conf.json is what the built
      # app reports as its version. If they disagree, `latest.json` announces a
      # version no install will ever match and the update offer never clears.
      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          read_json() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$1"; }
          conf=$(read_json apps/desktop/src-tauri/tauri.conf.json)
          pkg=$(read_json apps/desktop/package.json)
          cargo=$(awk -F'"' '/^version = /{print $2; exit}' apps/desktop/src-tauri/Cargo.toml)
          core=$(awk -F'"' '/^version = /{print $2; exit}' apps/desktop/src-tauri/core/Cargo.toml)
          agent=$(awk -F'"' '/^version = /{print $2; exit}' apps/desktop/src-tauri/agent/Cargo.toml)

          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ] || \
             [ "$tag" != "$core" ] || [ "$tag" != "$agent" ]; then
            echo "::error::Tag v$tag does not match the app version."
            echo "  tauri.conf.json: $conf"
            echo "  Cargo.toml:      $cargo"
            echo "  core/Cargo.toml: $core"
            echo "  agent/Cargo.toml: $agent"
            echo "  package.json:    $pkg"
            echo "Set all five to $tag, commit, then move the tag:"
            echo "  git tag -f v$tag && git push --force origin v$tag"
            exit 1
          fi

          # A placeholder key would build, ship, and then fail to launch: the
          # updater parses it at startup. Cheaper to catch here.
          pubkey=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['plugins']['updater']['pubkey'])")
          if [ "$pubkey" = "REPLACE_ME" ] || [ -z "$pubkey" ]; then
            echo "::error::plugins.updater.pubkey in tauri.conf.json is still a placeholder."
            echo "Generate a keypair and paste the public half in:"
            echo "  cd apps/desktop && bun tauri signer generate -w ~/.tauri/onlydiffs.key"
            exit 1
          fi

          echo "Releasing $tag."

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with `packageManager` in the root package.json.
          bun-version: 1.3.11

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The app, plus every host the agent is uploaded to. A release missing
          # one of these still builds and still runs — the probe refuses that
          # platform politely — but nobody on it can connect, so they are built
          # together or not at all.
          targets: aarch64-apple-darwin, x86_64-apple-darwin, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Shared with the `main` job in ci.yml, which is what fills it. A tag
          # can only restore from its own ref or the default branch, so without
          # that job — and without this key matching the one it saves under —
          # every release starts from nothing.
          shared-key: desktop-macos-arm64
          # Restore only. A cache saved here is written under this tag's ref,
          # where the next tag is not allowed to read it: a gigabyte uploaded
          # for nobody.
          save-if: false

      - run: bun install --frozen-lockfile

      # Cheap gates ahead of an expensive build. `cargo test` is deliberately
      # not here: it would compile the crate a second time in the debug
      # profile, and a Rust error fails the release build below anyway.
      - name: Typecheck
        run: bunx turbo run typecheck --filter=@onlydiffs/desktop

      - name: Test the renderer
        working-directory: apps/desktop
        run: bun run test:renderer

      # zig is the linker for the Linux targets, and the reason the glibc
      # version can be pinned rather than inherited from this runner.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      # The prebuilt binary rather than `cargo install`, which compiled it from
      # source on every release for the best part of a minute.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build the remote agents
        working-directory: apps/desktop
        run: ./scripts/build-agents.sh

      # `bundle.resources` in tauri.conf.json copies whatever is in `agents/`,
      # so a missing file would ship silently as a host nobody can connect to.
      - name: Check every agent made it
        run: |
          set -euo pipefail
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        aarch64-apple-darwin x86_64-apple-darwin; do
            agent="apps/desktop/src-tauri/agents/onlydiffs-agent-$triple"
            test -x "$agent" || { echo "::error::missing agent for $triple"; exit 1; }
            echo "$triple: $(stat -f%z "$agent") bytes"
          done

          # The one we can actually run here has to report the version the app
          # will look for, which is what the upload's match rule compares.
          version=$(apps/desktop/src-tauri/agents/onlydiffs-agent-aarch64-apple-darwin --version)
          expected="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$expected" ]; then
            echo "::error::agent reports $version, expected $expected"
            exit 1
          fi

      # Tauri validates bundle.resources while compiling the app, so the
      # agents must exist before the backend tests build it. These tests cover
      # the protocol, the agent, and the SSH transport against a real `sshd`.
      - name: Test the backend
        working-directory: apps/desktop/src-tauri
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifact. Without these the build still succeeds,
          # but ships no `.sig` and no installed copy will accept the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # tauri.conf.json uses identity `-` to give the complete app bundle a
          # valid ad-hoc seal. That catches corruption but does not establish an
          # Apple identity or satisfy Gatekeeper. Do not define empty APPLE_*
          # variables: Tauri would try to import an empty certificate.
          #
          # With a Developer ID in hand, add all four together, plus APPLE_ID /
          # APPLE_PASSWORD / APPLE_TEAM_ID to notarize. The environment identity
          # then replaces the ad-hoc identity from the config:
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          #   KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        with:
          projectPath: apps/desktop
          # The workspace lockfile lives at the root, so let the app's own
          # `tauri` script pick the CLI rather than leaving detection to guess.
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: onlydiffs ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Overrides `bundle.targets`, which also names Windows and Linux
          # formats this runner cannot produce. `app` is what becomes the
          # `.app.tar.gz` the updater downloads; `dmg` is what a human does.
          args: --target aarch64-apple-darwin --bundles app,dmg

      # A linker ad-hoc signs an Apple Silicon executable, but that alone does
      # not seal Info.plist or Resources. Gatekeeper reports that half-signed
      # bundle as damaged. Check both the bundle and the exact updater archive;
      # the release remains a draft if either one has lost its resource seal.
      - name: Verify the macOS bundle signatures
        run: |
          set -euo pipefail
          bundle_dir=apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          app="$bundle_dir/onlydiffs.app"
          archive="$bundle_dir/onlydiffs.app.tar.gz"

          test -f "$app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$app"

          # The agents are what make a remote host reachable, and a bundle that
          # signed cleanly without them is a release that quietly cannot connect.
          for triple in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        aarch64-apple-darwin x86_64-apple-darwin; do
            test -f "$app/Contents/Resources/agents/onlydiffs-agent-$triple"
          done

          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          tar -xzf "$archive" -C "$extracted"
          test -f "$extracted/onlydiffs.app/Contents/_CodeSignature/CodeResources"
          codesign --verify --deep --strict --verbose=2 "$extracted/onlydiffs.app"
