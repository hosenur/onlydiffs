name: Release (native)

# Pushing `native-v0.1.1` builds the GPUI app and opens a draft *prerelease*.
# Publishing it is what installed copies see (drafts are hidden from the
# unauthenticated API the updater reads). It stays a prerelease so
# `releases/latest` keeps pointing at the Tauri app, whose updater follows it.
on:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

jobs:
  macos-arm64:
    name: macOS (Apple Silicon)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # If the tag and Cargo.toml disagree, the updater's version check
      # refuses the download, and every copy offers the same update forever.
      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#native-v}"
          cargo=$(awk -F'"' '/^version = /{print $2; exit}' apps/native/Cargo.toml)
          if [ "$tag" != "$cargo" ]; then
            echo "::error::Tag native-v$tag does not match apps/native/Cargo.toml ($cargo)."
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      # Only for `tauri signer sign`.
      - run: bun install --frozen-lockfile

      - name: Test
        working-directory: apps/native
        run: cargo test

      - name: Bundle and sign
        working-directory: apps/native
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
          ./scripts/bundle.sh

      - name: Open a draft prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          out=apps/native/target/release/bundle
          gh release create "$GITHUB_REF_NAME" --draft --prerelease \
            --title "onlydiffs native ${GITHUB_REF_NAME#native-}" \
            --notes "Native (GPUI) build. Installed copies update themselves once this is published." \
            "$out"/onlydiffs-native-aarch64.app.tar.gz \
            "$out"/onlydiffs-native-aarch64.app.tar.gz.sig
