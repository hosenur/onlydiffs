# The app is also the workspace root: `cargo build` here still builds the app,
# which is what the Tauri CLI expects, while `-p onlydiffs-agent` builds the
# binary that gets uploaded to a remote host.
[workspace]
members = ["core", "agent"]

[package]
name = "onlydiffs"
version = "0.1.12"
description = "See what your agent changed. Talk it through."
authors = ["hosenur"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary is a thin shell over this; `cdylib` keeps the mobile
# entry point available and `rlib` is what the integration tests link against.
name = "onlydiffs_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
onlydiffs-core = { path = "core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.24.9", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
resvg = { version = "0.41", default-features = false }
tokio = { version = "1", features = ["process", "fs", "sync", "time", "macros", "rt-multi-thread"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dirs = "5"
notify-debouncer-full = "0.6.0"
ignore = "0.4.30"
# Not just for tests: the askpass socket lives in a 0700 temp directory whose
# destructor is what removes it when a connection ends or the app crashes.
tempfile = "3"

# Desktop-only: there is no updater on mobile, and the target cfg is what
# keeps the `cdylib` half of `[lib]` building without it.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"

[target."cfg(unix)".dependencies]
libc = "0.2.189"


# LTO and stripping help both binaries; only the agent trades speed for size,
# because it crosses an SSH connection once per version per host and its own
# code is not the hot path — git and image decoding are.
[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.release.package.onlydiffs-agent]
opt-level = "z"
